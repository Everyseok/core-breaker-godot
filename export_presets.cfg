; Godot 4.6 export preset — App-in-Toss Web deployment
; Generated: 2026-05-01 (C-26 / GM-05 compliance pass)
;
; IMPORTANT — BEFORE EXPORTING:
;   1. Open Godot editor → Project → Export → ensure "Toss Web" preset is loaded.
;   2. Download and install Godot 4.6 Web export templates if not already present.
;   3. Set export_path to a clean output directory (e.g. "build/web/index.html").
;   4. Run Export Project (not Export PCK).
;   5. After export, package the output directory as the .ait bundle for Toss submission.
;
; VIEWPORT / PINCH-ZOOM (C-26):
;   html/head_include injects a <meta name="viewport"> tag with user-scalable=no and
;   maximum-scale=1.0 into the <html> <head> of the exported page.
;   It also injects CSS:
;     canvas { touch-action: none }   — routes all touch events to Godot, prevents
;                                        browser-level scroll/zoom on the game canvas.
;     html, body { overscroll-behavior: none } — disables elastic overscroll on iOS/Android.
;   NOTE: Godot 4.6's default HTML shell may already include a <meta name="viewport">.
;   The head_include tag is placed after Godot's default head content, so browsers that
;   respect the last viewport meta (standard behavior) will use our stricter settings.
;   If duplicate metas cause any issue in future Toss shell QA, switch to a full custom
;   HTML shell (html/custom_html_shell) based on Godot 4.6's default template with the
;   viewport meta replaced directly.
;
; CANVAS RESIZE (canvas_resize_policy=2):
;   Adaptive mode: canvas fills the WebView window. Combined with project.godot's
;   window/stretch/mode="canvas_items", all UI scales proportionally to fill the screen.
;
; PORTRAIT ORIENTATION (progressive_web_app/orientation=1):
;   PWA is disabled (not used for .ait), but orientation=1 (portrait) is set for
;   documentation accuracy. Actual portrait lock on Toss WebView is handled by
;   PlatformBridge.DisplayServer.screen_set_orientation(SCREEN_PORTRAIT) at runtime
;   and by the App-in-Toss container itself (GM-05 / C-15).

[preset.0]

name="Toss Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\"><style>canvas{touch-action:none}html,body{overscroll-behavior:none;margin:0;padding:0}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
