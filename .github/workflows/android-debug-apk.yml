name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-debug-apk-artifact
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.6.2"
      GODOT_STATUS: "stable"
      GODOT_RELEASE_TAG: "4.6.2-stable"
      GODOT_TEMPLATE_DIR: "4.6.2.stable"
      GODOT_EDITOR_ZIP: "Godot_v4.6.2-stable_linux.x86_64.zip"
      GODOT_TEMPLATES_TPZ: "Godot_v4.6.2-stable_export_templates.tpz"
      EXPORT_PRESET_NAME: "Android Debug APK"
      APK_OUTPUT: "exports/android_debug/core_breaker_debug.apk"
      TEMP_DEBUG_PACKAGE: "com.junseokism.corebreaker.debug"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show debug artifact notice
        run: |
          echo "It is for private GitHub artifact APK testing only."
          echo "It is NOT a Google Play submission workflow."
          echo "APK is for direct phone sideload/debug QA. AAB is required later for Play Store submission."

      - name: Verify Android export preset exists
        run: |
          if ! grep -q 'name="Android Debug APK"' export_presets.cfg; then
            echo "::error::Missing Godot export preset named 'Android Debug APK'."
            echo "::error::Restore export_presets.cfg with the Android Debug APK preset before rerunning this workflow."
            exit 1
          fi

      - name: Detect Android SDK
        run: |
          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "${ANDROID_SDK_ROOT}" ]; then
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}" ]; then
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::error::Android SDK was not detected on the runner."
          echo "::error::Add an Android SDK setup step or switch to a runner image with Android SDK preinstalled."
          exit 1

      - name: Prepare Android SDK packages
        run: |
          SDKMANAGER=""
          for candidate in \
            "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT}/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager || true)"
          do
            if [ -n "${candidate}" ] && [ -x "${candidate}" ]; then
              SDKMANAGER="${candidate}"
              break
            fi
          done
          if [ -z "${SDKMANAGER}" ]; then
            echo "::error::sdkmanager was not found in the Android SDK installation."
            exit 1
          fi
          yes | "${SDKMANAGER}" --licenses
          "${SDKMANAGER}" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 \
            -deststoretype pkcs12
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Write CI Godot editor settings for Android export
        run: |
          mkdir -p "$HOME/.config/godot-ci"
          cat > "$HOME/.config/godot-ci/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          _export_preset_advanced_mode = false
          export/android/debug_keystore = "${GODOT_ANDROID_KEYSTORE_DEBUG_PATH}"
          export/android/debug_keystore_user = "${GODOT_ANDROID_KEYSTORE_DEBUG_USER}"
          export/android/debug_keystore_pass = "${GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          EOF

      - name: Patch CI Android export preset credentials
        run: |
          sed -i \
            -e "s|^keystore/debug=.*|keystore/debug=\"${GODOT_ANDROID_KEYSTORE_DEBUG_PATH}\"|" \
            -e "s|^keystore/debug_user=.*|keystore/debug_user=\"${GODOT_ANDROID_KEYSTORE_DEBUG_USER}\"|" \
            -e "s|^keystore/debug_password=.*|keystore/debug_password=\"${GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD}\"|" \
            export_presets.cfg
          test -f "${GODOT_ANDROID_KEYSTORE_DEBUG_PATH}"
          grep -n '^keystore/debug=' export_presets.cfg
          grep -n '^keystore/debug_user=' export_presets.cfg

      - name: Download official Godot editor
        run: |
          mkdir -p .ci-tools/godot
          curl -L --fail \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE_TAG}/${GODOT_EDITOR_ZIP}" \
            -o ".ci-tools/godot/${GODOT_EDITOR_ZIP}"
          unzip -q ".ci-tools/godot/${GODOT_EDITOR_ZIP}" -d .ci-tools/godot
          chmod +x ".ci-tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"

      - name: Download official Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          mkdir -p .ci-tools/templates
          curl -L --fail \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE_TAG}/${GODOT_TEMPLATES_TPZ}" \
            -o ".ci-tools/godot/${GODOT_TEMPLATES_TPZ}"
          unzip -q ".ci-tools/godot/${GODOT_TEMPLATES_TPZ}" -d .ci-tools/templates
          cp -R .ci-tools/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"
          ls -la "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/android_debug.apk"

      - name: Export debug APK
        run: |
          mkdir -p exports/android_debug
          ".ci-tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --verbose \
            --headless \
            --editor-settings-path "$HOME/.config/godot-ci" \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "${EXPORT_PRESET_NAME}" "${APK_OUTPUT}"
          test -f "${APK_OUTPUT}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-breaker-debug-apk
          path: exports/android_debug/core_breaker_debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="android-debug-latest"
          RELEASE_TITLE="Latest Debug APK"
          ASSET_SOURCE="exports/android_debug/core_breaker_debug.apk"
          ASSET_NAME="core-breaker-debug.apk"
          ASSET_DIR=".ci-tools/release"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"

          mkdir -p "${ASSET_DIR}"
          cp "${ASSET_SOURCE}" "${ASSET_PATH}"

          NOTES_FILE=".ci-tools/release/notes.md"
          cat > "${NOTES_FILE}" <<EOF
          Latest private debug APK for direct Android sideload testing.

          Direct APK download:
          ${DIRECT_URL}

          If the direct link returns 404, the latest workflow has not published successfully yet.
          EOF

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${ASSET_PATH}#${ASSET_NAME}" --clobber
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TITLE}" --notes-file "${NOTES_FILE}"
          else
            gh release create "${RELEASE_TAG}" "${ASSET_PATH}#${ASSET_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --notes-file "${NOTES_FILE}" \
              --prerelease
          fi
